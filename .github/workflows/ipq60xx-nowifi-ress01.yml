name: 京东云亚瑟（无 Wi-Fi）

on:
  workflow_dispatch:
  schedule:
    # 每周日北京时间 22:15 自动编译
    - cron: '15 14 * * 0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 京东云亚瑟（无 Wi-Fi）
    uses: ./.github/workflows/core.yml
    with:
      TARGET: ipq60xx-libWrt-nowifi-ress01
      REPO_SOURCE: LibWrt
      REPO_URL: https://github.com/LiBwrt/LibWrt
      REPO_BRANCH: 25.12-nss
      CONFIG_FILE: ./config/arm/nowifi-ress01.config
