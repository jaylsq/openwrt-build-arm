# Manual builds only; no scheduled trigger.
name: 手动完整编译 ARM 固件

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: nowifi-ress01
            target: ipq60xx-libWrt-nowifi-ress01
            config: ./config/arm/nowifi-ress01.config
          - device: nowifi-znm2
            target: ipq60xx-libWrt-nowifi-znm2
            config: ./config/arm/nowifi-znm2.config
    uses: ./.github/workflows/core.yml
    with:
      TARGET: ${{ matrix.target }}
      REPO_SOURCE: LibWrt
      REPO_URL: https://github.com/LiBwrt/openwrt-6.x
      REPO_BRANCH: 25.12-nss
      CONFIG_FILE: ${{ matrix.config }}
